# ProcPilot configuration
# Owner: Muhammad Shahid Raza
#
# Only the three settings below may be overridden here. Every path is derived
# from the project root by load_config() and is intentionally not configurable.
# Values must be positive integers; thresholds are percentages (1-100).

# Dashboard refresh interval in seconds.
PP_REFRESH_INTERVAL=2

# Warn when overall system CPU usage reaches this percentage.
PP_CPU_WARNING_THRESHOLD=80

# Warn when overall system RAM usage reaches this percentage.
PP_RAM_WARNING_THRESHOLD=80
